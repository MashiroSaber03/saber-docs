name: Check and Deploy Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a deployment while files are being replaced.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build VitePress
        run: npm run docs:build
      - name: Verify site
        run: test -s .vitepress/dist/index.html
      - name: Upload to server
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: '.vitepress/dist'
          target: '/tmp/saber-docs-${{ github.run_id }}-${{ github.run_attempt }}'
      - name: Deploy on server
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            staging="/tmp/saber-docs-${{ github.run_id }}-${{ github.run_attempt }}"
            deploy_path="/www/wwwroot/mashirosaber.top"
            test -s "$staging/.vitepress/dist/index.html"
            test -d "$deploy_path"
            command -v rsync >/dev/null
            # Transfer first, replace files at the end, then remove stale files.
            # Preserve server-managed dotfiles (e.g. .user.ini and .well-known).
            rsync -rlt --delay-updates --delete-delay --exclude='/.*' \
              "$staging/.vitepress/dist/" "$deploy_path/"
            rm -rf -- "$staging"
